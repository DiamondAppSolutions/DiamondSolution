[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — react-router-dom handles routing client-side, so every path
# (e.g. a direct load of /dashboard, /login) must still serve index.html and
# let the app's own router take over, or Netlify would 404 on anything but "/".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
